<title>Бэктест · Renaissance</title>
<style>
:root{--bg1:#f4f4f6;--blob:rgba(255,255,255,.9);--blob2:rgba(150,150,160,.35);--ink:#0b0b0c;--mute:rgba(11,11,12,.56);--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.85);--line:rgba(0,0,0,.09);--shadow:0 10px 40px rgba(0,0,0,.08);--on:#0b0b0c;--onink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg1:#050505;--blob:rgba(255,255,255,.10);--blob2:rgba(120,120,130,.18);--ink:#f5f5f7;--mute:rgba(245,245,247,.55);--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.18);--line:rgba(255,255,255,.10);--shadow:0 10px 40px rgba(0,0,0,.5);--on:#f5f5f7;--onink:#0b0b0c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);background:var(--bg1);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(60px);pointer-events:none}
body::before{width:70vmax;height:70vmax;left:-25vmax;top:-20vmax;background:radial-gradient(circle,var(--blob),transparent 65%)}
body::after{width:60vmax;height:60vmax;right:-25vmax;bottom:-15vmax;background:radial-gradient(circle,var(--blob2),transparent 65%)}
main{position:relative;z-index:1;max-width:660px;margin:0 auto;padding:16px 14px 60px}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:26px;-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);box-shadow:var(--shadow),inset 0 1px 0 var(--edge)}
.hdr{padding:0 8px 10px;font-size:15px;font-weight:600;color:var(--mute)}
.tabs{display:flex;padding:5px;gap:4px;margin-bottom:14px;border-radius:999px}
.tabs button{flex:1;font:inherit;font-size:13px;font-weight:600;color:var(--mute);background:transparent;border:0;border-radius:999px;padding:10px 2px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--on);color:var(--onink)}
button:focus-visible,.item:focus-within,.jr:focus-visible{outline:2px solid var(--on);outline-offset:2px}
.card{margin-bottom:14px;padding:6px}
.card>h2{margin:0;padding:16px 16px 6px;font-size:20px;font-weight:650;letter-spacing:-.015em}
.card>p{margin:0;padding:0 16px 10px;font-size:14px;color:var(--mute)}
.row{padding:12px 16px;position:relative}
.row+.row::before,.item+.item::before,.jr+.jr::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line)}
.row b{font-weight:650}.row span{display:block;font-size:14px;color:var(--mute);margin-top:2px}
.vd{padding:18px 22px;margin-bottom:14px;display:flex;align-items:center;gap:18px}
.big{font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1;min-width:84px}
.vd p{margin:0;color:var(--mute);font-size:15px}
.sec{padding:12px 16px 2px;font-size:14px;font-weight:600;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 16px 8px}
.chips button,.pill{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--on);color:var(--onink);border-color:var(--on)}
.item{display:flex;gap:14px;align-items:flex-start;padding:12px 16px;cursor:pointer;position:relative}
.item+.item::before{left:54px}
.item input{position:absolute;opacity:0;pointer-events:none}
.dot{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--mute);margin-top:1px;display:grid;place-items:center}
.dot svg{width:13px;height:13px;stroke:var(--onink);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.item input:checked+.dot{background:var(--on);border-color:var(--on)}
.item input:checked+.dot svg{opacity:1}
.fld{font:inherit;font-size:16px;width:100%;padding:10px 12px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:14px}
textarea.fld{min-height:90px;resize:vertical}
.fw{padding:6px 16px 4px}
.btn{display:block;width:calc(100% - 32px);margin:14px 16px 10px;text-align:center;background:var(--on);color:var(--onink);border-color:var(--on)}
.shot{max-width:100%;max-height:200px;border-radius:14px;margin-top:10px;display:block}
.chd{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 4px 16px}
.chd h2{margin:0;font-size:18px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px 10px 10px}
.wd{font-size:12px;color:var(--mute);text-align:center;padding:4px 0}
.day{font:inherit;font-size:14px;aspect-ratio:1/1.05;border:1px solid transparent;border-radius:14px;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0}
.day i{font-style:normal;font-size:10px;line-height:1.1}
.day.g{background:rgba(48,209,88,.26)}.day.r{background:rgba(255,69,58,.30)}.day.z{background:rgba(140,140,150,.22)}
.day.t{border-color:var(--on)}.day.s{outline:2px solid var(--on)}
.e{visibility:hidden}
.legend{padding:0 16px 12px;font-size:13px;color:var(--mute)}
.jr{padding:12px 16px;position:relative;cursor:pointer}
.jr b{font-weight:650}.jr span{display:block;font-size:14px;color:var(--mute);margin-top:2px}
.gd{display:inline-block;min-width:26px;text-align:center;padding:0 7px;border-radius:999px;border:1px solid var(--line);margin-right:6px;font-size:13px}
.jd{margin-top:8px;padding-top:4px;border-top:1px solid var(--line);cursor:default}
.jd p{margin:3px 0;font-size:14px}
.jd h4{margin:10px 0 4px;font-size:13px;font-weight:600;color:var(--mute)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 10px 10px}
.kpi div{border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em}.kpi span{font-size:13px;color:var(--mute)}
.tb{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:4px 16px 12px;font-size:14px}
.tb span{color:var(--mute);text-align:right}
svg.eq{display:block;width:calc(100% - 32px);margin:6px 16px 12px;color:var(--ink)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:12px}
.toast{padding:0 16px 8px;font-size:14px;font-weight:600}
.dt{margin:6px 0 8px;border:1px solid var(--line);border-radius:14px;padding:0 12px}
.dt summary{cursor:pointer;padding:12px 0;font-size:15px;font-weight:600;color:var(--mute);list-style:none}
.dt summary::-webkit-details-marker{display:none}
.dt .sec{padding:10px 0 2px}
.dt .chips{padding:6px 0 8px}
.nbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.nb{font-style:normal;font-size:12px;font-weight:600;line-height:1;display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 6px;border-radius:6px;color:var(--ink);background:rgba(128,128,128,.14)}
.nb::before{content:"";width:9px;height:9px;border-radius:2px;background:#9a9a9a;flex:none}
.nb.r{background:rgba(255,69,58,.16)}.nb.r::before{background:#e5382c}
.nb.o{background:rgba(255,159,10,.2)}.nb.o::before{background:#f08c00}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px 8px}
.gear{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.gear svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.danger{border-color:rgba(255,69,58,.55)!important;color:#e5382c!important}
.cal.w8{grid-template-columns:repeat(7,1fr) 52px}
.wk{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;line-height:1.2;border-radius:12px;background:rgba(128,128,128,.10);padding:2px}
.wk b{font-weight:700}.wk i{font-style:normal;font-size:10px;color:var(--mute);font-weight:500}
.wk.g b,.msum b.pos{color:#1f9d4c}.wk.r b,.msum b.neg{color:#e5382c}
.msum{padding:0 18px 8px;font-size:14px;color:var(--mute)}.msum b{font-weight:700;color:var(--ink)}
[hidden]{display:none!important}
</style>
</head>
