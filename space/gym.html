<style>
:root{--bg1:#f4f4f6;--blob:rgba(255,255,255,.9);--blob2:rgba(150,150,160,.35);--ink:#0b0b0c;--mute:rgba(11,11,12,.56);--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.85);--line:rgba(0,0,0,.09);--shadow:0 10px 40px rgba(0,0,0,.08);--on:#0b0b0c;--onink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg1:#050505;--blob:rgba(255,255,255,.10);--blob2:rgba(120,120,130,.18);--ink:#f5f5f7;--mute:rgba(245,245,247,.55);--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.18);--line:rgba(255,255,255,.10);--shadow:0 10px 40px rgba(0,0,0,.5);--on:#f5f5f7;--onink:#0b0b0c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);background:var(--bg1);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(60px);pointer-events:none}
body::before{width:70vmax;height:70vmax;left:-25vmax;top:-20vmax;background:radial-gradient(circle,var(--blob),transparent 65%)}
body::after{width:60vmax;height:60vmax;right:-25vmax;bottom:-15vmax;background:radial-gradient(circle,var(--blob2),transparent 65%)}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:18px 14px 150px}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:26px;-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);box-shadow:var(--shadow),inset 0 1px 0 var(--edge);margin-bottom:14px}
.top{padding:22px}
.top h1{margin:0;font-size:15px;font-weight:600;color:var(--mute)}
.big{font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.big small{font-size:22px;font-weight:500;color:var(--mute);letter-spacing:-.01em}
.top p{margin:6px 0 0;color:var(--mute);font-size:15px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--on);border-radius:6px;transition:width .3s}
.chd{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 4px 18px}
.chd h2{margin:0;font-size:18px;text-transform:capitalize}
.pill{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;min-width:44px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px 10px 10px}
.wd{font-size:12px;color:var(--mute);text-align:center;padding:4px 0}
.day{font:inherit;font-size:14px;aspect-ratio:1/1.05;border:1px solid transparent;border-radius:14px;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0}
.day i{font-style:normal;font-size:11px;font-weight:700;line-height:1.1}
.day.f{border-color:var(--line)}.day.g{background:rgba(48,209,88,.28)}.day.d{background:rgba(48,209,88,.12)}.day.p{background:rgba(255,204,0,.28)}.day.r{background:rgba(255,69,58,.28)}
.day.t{border-color:var(--on)}.day.s{outline:2px solid var(--on)}
.e{visibility:hidden}
.legend{padding:0 18px 14px;font-size:13px;color:var(--mute)}
h2.h{margin:0;padding:18px 18px 4px;font-size:20px;font-weight:650;letter-spacing:-.015em}
.sub{padding:0 18px 8px;font-size:14px;color:var(--mute)}
.ex{padding:14px 18px;position:relative}
.ex+.ex::before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:var(--line)}
.exh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.exh b{font-weight:600}.exh span{display:block;font-size:14px;color:var(--mute)}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.sb{font:inherit;font-size:15px;font-weight:700;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--mute);background:transparent;color:var(--ink);cursor:pointer;padding:0}
.sb[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:var(--onink)}
.kg{font:inherit;font-size:16px;width:84px;padding:9px 10px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:12px;text-align:right}
.lw{font-size:12px;color:var(--mute);text-align:right;margin-top:2px}
button:focus-visible,input:focus-visible{outline:2px solid var(--on);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 18px 12px}
.chips button{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--on);color:var(--onink);border-color:var(--on)}
.rest{padding:6px 18px 18px;color:var(--mute)}
.sec{padding:12px 18px 2px;font-size:14px;font-weight:600;color:var(--mute)}
.lr{display:flex;align-items:center;gap:8px;padding:8px 18px}
.lr span{flex:1}.lr small{color:var(--mute)}
.lr button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:4px 10px;cursor:pointer;min-width:36px}
.fld{font:inherit;font-size:16px;padding:10px 12px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:14px;min-width:0}
.frm{display:flex;gap:8px;padding:6px 18px 12px;flex-wrap:wrap}
.btn{font:inherit;font-size:15px;font-weight:600;background:var(--on);color:var(--onink);border:0;border-radius:999px;padding:11px 18px;cursor:pointer}
details.lib{margin:4px 18px 14px;border:1px solid var(--line);border-radius:14px;padding:0 12px}
details.lib summary{cursor:pointer;padding:12px 0;font-size:15px;font-weight:600;color:var(--mute);list-style:none}
details.lib summary::-webkit-details-marker{display:none}
details.lib .sec{padding:8px 0 2px}.details.lib .chips{padding:6px 0 8px}
details.lib .chips{padding:6px 0 8px}
.tmb{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;max-width:616px;margin:0 auto;padding:12px 16px 14px}
.tmb .r1{display:flex;align-items:baseline;justify-content:space-between}
.tmb b{font-size:34px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tmb .r1 span{font-size:14px;color:var(--mute)}
.tmb .r2{display:flex;gap:8px;margin-top:10px}
.tmb .pill{flex:1}
.inf{margin-top:12px;padding:4px 14px 14px;border:1px solid var(--line);border-radius:14px;font-size:14px;line-height:1.5}
.inf h4{margin:12px 0 4px;font-size:13px;font-weight:600;color:var(--mute)}
.inf p{margin:2px 0}.inf ol,.inf ul{margin:2px 0;padding-left:20px}.inf li{margin:2px 0}
.inf .warn{margin-top:12px;color:var(--mute)}
.inf a{display:inline-block;margin-top:8px;color:var(--ink);font-weight:600}
[hidden]{display:none!important}
</style>
</head>

        SYNC.col=db.collection("data/users/"+id);
        return SYNC.col.limit(1000).get().then(function(sn){
          var cfg=null,days={};
          sn.docs.forEach(function(d){
            if(d.id==="gym_cfg")cfg=d.data();
            else if(d.id.indexOf("gym_d_")===0)days[d.id.slice(6)]=d.data()});
          if(cfg){
            Object.keys(cfg).forEach(function(k){S[k]=cfg[k]});
            Object.keys(days).forEach(function(d){if(!DIRTY[d])S.log[d]=days[d]});
          }
          Object.keys(S.log).forEach(function(d){if(!days[d]&&hasData(d))DIRTY[d]=1});
          try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
          SYNC.ok=true;pushNow();
          SEL=typeOf(TODAY)?TODAY:nextTraining();
          rTop();rCal();rDay();rRest();rExs();rSet();
        })})}).catch(noop)}catch(e){}}
rTop();rCal();rDay();rRest();rExs();rSet();save();initSync();
